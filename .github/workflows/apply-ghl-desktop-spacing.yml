name: Apply GHL Desktop Spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop spacing override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '@media (prefers-reduced-motion:reduce)'
          block = '''/* GHL desktop space optimization — keeps tablet/mobile behavior unchanged */
          @media (min-width:1101px){
            :root{--rail:220px;--content:1600px;--reading:1040px}
            html,body{width:100%;max-width:none}
            .app-shell{
              width:100vw;
              max-width:100vw;
              margin-left:calc(50% - 50vw);
              margin-right:calc(50% - 50vw);
              grid-template-columns:var(--rail) minmax(0,1fr);
            }
            .site-nav{padding:18px 13px 16px;gap:16px}
            .view{padding:24px clamp(18px,1.7vw,30px) 52px}
            .content-shell{width:100%;max-width:var(--content);margin-inline:auto}
            .dashboard-hero{
              grid-template-columns:minmax(0,1.22fr) minmax(320px,.70fr);
              gap:clamp(22px,2.8vw,44px);
              min-height:410px;
              padding:clamp(28px,3vw,46px);
            }
            .hero-copy h1{max-width:880px}
            .hero-copy p{max-width:820px}
            .avatar-stage{height:320px;min-width:320px}
            .directory{padding-top:24px}
            .section-intro{gap:20px;margin-bottom:14px}
            .agent-grid{gap:12px}
            .agent-card{padding:18px}
            .guide-shell{max-width:1440px}
            .guide-header{padding:22px 0 24px}
            .guide-content{max-width:var(--reading)}
            .use-agent{margin:22px 0 32px}
          }
          @media (min-width:1680px){
            .agent-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
            .agent-card h3{font-size:23px}
            .agent-card p{font-size:13px;line-height:1.6}
          }

          '''

          if 'GHL desktop space optimization' not in text:
              if marker not in text:
                  raise SystemExit('Reduced-motion marker not found; refusing to modify index.html')
              text = text.replace(marker, block + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit revised index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Optimize desktop spacing for GHL'
          git push
